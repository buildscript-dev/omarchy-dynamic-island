# Live spectrum for the island's music waveform. Read by cava only; the island
# parses one line of "n;n;n;...;" per frame, values 0-100.
[general]
bars = 6
framerate = 30
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
